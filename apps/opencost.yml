apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opencost
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://opencost.github.io/opencost-helm-chart'
    chart: opencost
    targetRevision: 1.15.0
    helm:
      values: |
        opencost:
          extraEnv:
            - name: CLOUD_PROVIDER
              value: "custom"
          exporter:
            cloudProviderApiKey: "disabled"
            defaultClusterId: "yandex-cloud-cluster"
          customPricing:
            enabled: true
            provider: "custom"
            costModel:
              GPU: "0.000000"
              RAM: "0.216000"
              storage: "0.000000"
              zone: "ru-central1-a"
              description: "Custom k3s pricing model"
          prometheus:
            internal:
              enabled: false
            external:
              enabled: true
              url: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: opencost
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
