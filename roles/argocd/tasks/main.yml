- name: Проверка, создан ли уже namespace Argocd
  ansible.builtin.command: "kubectl get ns argocd"
  register: argocd_ns_check
  failed_when: false
  changed_when: false

- name: Создание namespace для ArgoCD
  ansible.builtin.command: "kubectl create namespace argocd"
  when: argocd_ns_check.rc != 0
  changed_when: true

- name: Развертывание манифеста argoCD
  ansible.builtin.command: >
    kubectl apply -n argocd -f
    https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
    --server-side=true --force-conflicts
  changed_when: true

- name: Ожидание запуска основных подов ArgoCD
  ansible.builtin.command: >
    kubectl get pods -n argocd -l app.kubernetes.io/name=argocd-server
    -o jsonpath='{.items[*].status.phase}'
  register: argocd_pods_status
  changed_when: false

- name: Перевод веб-интерфейса ArgoCD в режим NodePort
  ansible.builtin.command:
    cmd: "kubectl patch svc argocd-server -n argocd -p '{\"spec\":{\"type\":\"NodePort\",\"ports\":[{\"port\":80,\"nodePort\":30080}]}}'"
  changed_when: true

- name: Создание временного файла манифеста корневого приложения ArgoCD
  ansible.builtin.copy:
    dest: /tmp/apps.yaml
    mode: '0644'
    content: |
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: apps
        namespace: argocd
      spec:
        project: default
        source:
          repoURL: "https://github.com/qwizzy12/finOPS-pet"
          targetRevision: HEAD
          path: apps
        destination:
          server: "https://kubernetes.default.svc"
          namespace: argocd
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - CreateNamespace=true
            - ServerSideApply=true
            - SkipDryRunOnMissingResource=true
  changed_when: false

- name: Применение манифеста приложения apps в Kubernetes
  ansible.builtin.command: kubectl apply -f /tmp/apps.yaml
  changed_when: true

- name: Создание namespace monitoring для Grafana
  ansible.builtin.shell: "kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -"
  changed_when: true

- name: Удаление старого кэша дашборда OpenCost перед импортом
  ansible.builtin.shell: "kubectl delete configmap opencost-grafana-dashboard -n monitoring --ignore-not-found=true"
  changed_when: true

- name: Нативный автодеплой дашборда OpenCost в Grafana через манифесты K3s
  ansible.builtin.copy:
    dest: /var/lib/rancher/k3s/server/manifests/opencost-grafana-dashboard.yaml
    mode: '0644'
    content: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: opencost-grafana-dashboard
        namespace: monitoring
        labels:
          grafana_dashboard: "1"
        annotations:
          grafana.org/folder: "OpenCost"
      data:
        opencost-dashboard.json: |
          {{ lookup('file', 'opencost-dashboard.json') | indent(10) }}
