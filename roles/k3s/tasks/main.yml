- name: Скачивание и установка k3s
  ansible.builtin.command: "curl -sfL https://get.k3s.io | sh -"
  args:
    creates: /usr/local/bin/k3s
  changed_when: true

- name: Ожидание инциализации k3s
  ansible.builtin.wait_for:
    timeout: 20

- name: Проверка нод кластера
  ansible.builtin.command: "kubectl get nodes"
  register: k3s_kubectl_output
  changed_when: false

- name: Вывод статуса k3s
  ansible.builtin.debug:
    var: k3s_kubectl_output.stdout_lines
